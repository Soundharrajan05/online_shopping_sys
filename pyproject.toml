[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "online-shopping-sys"
version = "0.1.0"
dependencies = [
    "Flask==3.0.0",
    "mysql-connector-python==8.2.0",
    "psycopg2-binary==2.9.10",
    "werkzeug==3.0.1",
    "python-dotenv==1.0.0"
]

[tool.vercel]
entrypoint = "api/index.py"
